services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    networks:
      - todo_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-todo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_this_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-todo_app}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - todo_network
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-todo_admin}:${MONGO_ROOT_PASSWORD:-change_this_password}@mongo:27017/${MONGO_DATABASE:-todo_app}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - todo_network
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - api

volumes:
  mongo_data:

networks:
  todo_network:
    name: todo_network
    driver: bridge

